## Netlify config for NeonTube (TanStack Start + Nitro)
## The Nitro Netlify preset emits public assets to dist/ and the server
## function to .netlify/functions-internal/. Netlify reads the generated
## function config automatically, so no manual redirect is needed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"
